<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ride Radar SOS Alert</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Ride Radar <small>SOS alert</small></a>
  </header>
  <main class="wrap wide">
    <h1 class="page-title" id="title" role="status">Loading alert…</h1>
    <p class="stale" id="duress" hidden>The duress PIN was used: the rider may be with the person threatening them. Do not call the rider's phone. Call 112.</p>
    <p><a class="btn share-btn" href="tel:112">Call 112</a></p>
    <p class="notice" id="where"></p>
    <div id="map" class="map" role="region" aria-label="Latest location"></div>
    <h2>What we know</h2>
    <p id="summary" class="reason"></p>
    <details id="transcript-box" hidden><summary>Audio transcript (automatic, may be wrong)</summary><p id="transcript"></p></details>
    <h2>Video</h2>
    <video id="video" controls playsinline preload="metadata" hidden></video>
    <p class="notice" id="video-note">No video yet.</p>
    <p class="src-meta" id="hash"></p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/alert.js"></script>
</body>
</html>
